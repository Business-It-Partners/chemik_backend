# SECURE Production Application Configuration
spring:
  application:
    name: Chemiki

  # ✅ SECURE: Use environment variables for database
  datasource:
    url: ${DB_URL:jdbc:postgresql://dgclick.com/chimeki_developer}
    username: ${DB_USERNAME:dgUser}
    password: ${DB_PASSWORD:sljlsdfj!!sdljl343}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 20000
      connection-test-query: SELECT 1

  # ✅ SECURE: File upload limits
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
