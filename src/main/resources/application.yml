      file-size-threshold: 2KB

  jpa:
    hibernate:
      ddl-auto: validate  # ✅ SECURE: Never use 'update' in production
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  # ✅ SECURE: Mail configuration with environment variables
