server:
  port: 5072
  #    8080
  #    5072
  tomcat:
    connection-timeout: 30000
  servlet:
    session:
      timeout: 1800

logging:
  level:
    root: INFO
    com.chemiki.app: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: ERROR
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%logger{36}] - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%logger{36}] - %msg%n"
  file:
    name: ${LOG_FILE:/var/log/chemiki/application.log}
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_FILE:/var/log/chemiki/application.log}.%d{yyyy-MM-dd}.%i
      max-file-size: 10MB
      total-size-cap: 100MB
      max-history: 30
      clean-history-on-start: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: always

cors:
  allowed-origins: ${http://localhost:5173,http://localhost:3000,http://192.168.18.49:3000,    http://localhost:3000,https://gajuri.app}
  allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
  allowed-headers: "*"
  allow-credentials: true