# ✅ SECURE: JWT configuration with environment variables
jwt:
  secret: ${JWT_SECRET:R0hvSzdnQkhtNWtFbUJwdVJtT1BDR0V0VEcxY09qTlQ=}  # Base64 encoded
  accessTokenExpiration: ${JWT_ACCESS_EXPIRATION:900000}    # 15 minutes
