# Application configuration
app:
  base-url: ${APP_BASE_URL:http://192.168.18.12:8080}
  firebase-configuration-file: firebase-adminsdk.json
  email:
    from: ${EMAIL_FROM:noreply@gajuri.com}

# Server configuration
server:
  port: ${SERVER_PORT:8080}
  tomcat:
    connection-timeout: 30000
  servlet:
    session:
      timeout: 1800

# ✅ PRODUCTION: Proper logging configuration
logging:
  level:
    root: INFO
    com.chemiki.app: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: ERROR
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%logger{36}] - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%logger{36}] - %msg%n"
  file:
    name: ${LOG_FILE:/var/log/chemiki/application.log}
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_FILE:/var/log/chemiki/application.log}.%d{yyyy-MM-dd}.%i
      max-file-size: 10MB
      total-size-cap: 100MB
      max-history: 30
      clean-history-on-start: false

# ✅ PRODUCTION: Health check and monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: always

# ✅ CORS configuration
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,https://dgclick.com}
  allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
  allowed-headers: "*"
  allow-credentials: true