spring:
  datasource:
    url: jdbc:postgresql://dgclick.com/chimeki_developer
    username: dgUser
    password: sljlsdfj!!sdljl343
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 20000
      connection-test-query: SELECT 1
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  tomcat:
    connection-timeout: 30000   # 30 seconds (production recommended)
  servlet:
    session:
      timeout: 1800  # 30 minutes (production recommended)

# Application-specific configuration
app:
  base-url: http://192.168.18.12:8080
  firebase-configuration-file: firebase-adminsdk.json

logging:
  level:
    root: INFO
    com.dg_click.backend: DEBUG
  file:
    name: ./application.log
  logback:
    rollingpolicy:
      file-name-pattern: ./application.log.%d{yyyy-MM-dd}.%i
      max-file-size: 10MB
      total-size-cap: 100MB
      max-history: 30
      clean-history-on-start: false

cors:
  allowed-origins: "http://localhost:5173, https://dgclick.com"
  allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
  allowed-headers: "*"
  allow-credentials: true